<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Offer Letter Case File</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1C2430;
    --paper: #F6F3EC;
    --paper-dark: #EDE8DC;
    --line: #D8D2C4;
    --alert: #B3261E;
    --amber: #C98A2C;
    --verified: #2F6845;
    --text: #2A2A28;
    --muted: #6B6558;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper-dark);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    display: flex;
    justify-content: center;
    padding: 48px 20px;
  }
  .case {
    width: 100%;
    max-width: 760px;
    background: var(--paper);
    border: 1px solid var(--line);
  }
  .case-header {
    background: var(--ink);
    color: var(--paper);
    padding: 28px 36px;
  }
  .case-header .label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: #9BA5B0;
    letter-spacing: 0.02em;
  }
  .case-header h1 {
    font-family: 'Source Serif 4', serif;
    font-size: 28px;
    font-weight: 600;
    margin: 6px 0 0 0;
  }
  .case-body { padding: 36px; }
  .section-title {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 12px;
    border-bottom: 1px solid var(--line);
    padding-bottom: 8px;
  }
  .upload-row {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 16px;
    border: 1px dashed var(--line);
    margin-bottom: 20px;
    background: #FCFAF5;
  }
  .upload-row input[type="file"] { font-family: 'Inter', sans-serif; font-size: 13px; }
  .or-divider {
    text-align: center;
    color: var(--muted);
    font-size: 12px;
    font-family: 'IBM Plex Mono', monospace;
    margin: 4px 0 16px;
  }
  textarea {
    width: 100%;
    height: 140px;
    padding: 14px;
    border: 1px solid var(--line);
    background: #FCFAF5;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    color: var(--text);
    resize: vertical;
  }
  textarea:focus, input[type="file"]:focus { outline: 2px solid var(--ink); outline-offset: 2px; }
  button {
    margin-top: 18px;
    background: var(--ink);
    color: var(--paper);
    border: none;
    padding: 13px 28px;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
  }
  button:hover { background: #2B3648; }
  button:disabled { background: #A8A296; cursor: not-allowed; }
  #loading {
    margin-top: 16px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    color: var(--muted);
    display: none;
  }
  #resultWrap { display: none; margin-top: 36px; }
  .verdict-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    border-top: 1px solid var(--line);
    padding-top: 28px;
  }
  .verdict-text .section-title { border: none; padding: 0; margin-bottom: 8px; }
  .summary {
    font-family: 'Source Serif 4', serif;
    font-size: 17px;
    line-height: 1.5;
    max-width: 420px;
  }
  .stamp {
    font-family: 'Source Serif 4', serif;
    font-weight: 700;
    font-size: 20px;
    border: 3px solid;
    padding: 8px 18px;
    transform: rotate(-6deg);
    white-space: nowrap;
    letter-spacing: 0.03em;
  }
  .stamp.High { color: var(--alert); border-color: var(--alert); }
  .stamp.Medium { color: var(--amber); border-color: var(--amber); }
  .stamp.Low { color: var(--verified); border-color: var(--verified); }
  .meter-block { margin-top: 28px; }
  .meter-labels {
    display: flex;
    justify-content: space-between;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .meter-track {
    height: 8px;
    background: var(--paper-dark);
    border: 1px solid var(--line);
  }
  .meter-fill { height: 100%; transition: width 0.6s ease; }
  .confidence-note {
    margin-top: 8px;
    font-size: 12px;
    color: var(--muted);
    font-family: 'IBM Plex Mono', monospace;
  }
  .flags { margin-top: 32px; }
  .flag-item {
    padding: 16px 0;
    border-top: 1px solid var(--line);
  }
  .flag-item:last-child { border-bottom: 1px solid var(--line); }
  .flag-issue {
    font-weight: 600;
    font-size: 15px;
    margin-bottom: 4px;
  }
  .flag-reasoning {
    font-size: 14px;
    color: var(--text);
    line-height: 1.5;
    margin-bottom: 6px;
  }
  .flag-source {
    display: inline-block;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    background: var(--paper-dark);
    padding: 3px 8px;
    border: 1px solid var(--line);
  }
  .no-flags {
    font-family: 'Source Serif 4', serif;
    font-size: 16px;
    color: var(--verified);
    margin-top: 24px;
  }
</style>
</head>
<body>
<div class="case">
  <div class="case-header">
    <div class="label">CASE FILE — OFFER LETTER VERIFICATION</div>
    <h1>Offer Letter Analyzer</h1>
  </div>
  <div class="case-body">
    <div class="section-title">EXHIBIT A — DOCUMENT SUBMITTED</div>

    <div class="upload-row">
      <label><strong>Upload file:</strong></label>
      <input type="file" id="fileInput" accept=".pdf,.txt">
    </div>
    <div class="or-divider">— OR PASTE TEXT BELOW —</div>
    <textarea id="offerText" placeholder="Paste the offer letter text here..."></textarea>
    <br>
    <button id="analyzeBtn" onclick="analyzeOffer()">Analyze Offer</button>
    <div id="loading">Reviewing against case records...</div>

    <div id="resultWrap">
      <div class="verdict-row">
        <div class="verdict-text">
          <div class="section-title">FINDINGS</div>
          <div class="summary" id="summaryText"></div>
        </div>
        <div class="stamp" id="stampEl"></div>
      </div>

      <div class="meter-block">
        <div class="meter-labels">
          <span>RISK SCORE</span>
          <span id="scoreLabel"></span>
        </div>
        <div class="meter-track"><div class="meter-fill" id="meterFill"></div></div>
        <div class="confidence-note" id="confidenceNote"></div>
      </div>

      <div class="flags" id="flagsList"></div>
    </div>
  </div>
</div>

<script>
const levelColor = { High: '#B3261E', Medium: '#C98A2C', Low: '#2F6845' };

async function analyzeOffer() {
  const fileInput = document.getElementById('fileInput');
  const text = document.getElementById('offerText').value.trim();
  const resultWrap = document.getElementById('resultWrap');
  const loading = document.getElementById('loading');
  const btn = document.getElementById('analyzeBtn');

  if (!fileInput.files.length && !text) {
    alert('Please upload a file or paste offer letter text.');
    return;
  }

  resultWrap.style.display = 'none';
  loading.style.display = 'block';
  btn.disabled = true;

  try {
    let response;
    if (fileInput.files.length) {
      const formData = new FormData();
      formData.append('file', fileInput.files[0]);
      response = await fetch('/analyze-offer-file', { method: 'POST', body: formData });
    } else {
      response = await fetch('/analyze-offer', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ offer_text: text })
      });
    }
    const data = await response.json();
    renderResult(data);
  } catch (err) {
    document.getElementById('summaryText').textContent = 'Error: could not reach the server.';
    resultWrap.style.display = 'block';
  } finally {
    loading.style.display = 'none';
    btn.disabled = false;
  }
}

function renderResult(data) {
  const level = data.risk_level || 'Low';
  const score = data.risk_score ?? 0;
  const color = levelColor[level] || '#2F6845';

  document.getElementById('summaryText').textContent = data.summary || '';
  const stamp = document.getElementById('stampEl');
  stamp.textContent = level === 'High' ? 'FLAGGED' : level === 'Medium' ? 'CAUTION' : 'CLEAR';
  stamp.className = 'stamp ' + level;

  document.getElementById('scoreLabel').textContent = score + ' / 100';
  const fill = document.getElementById('meterFill');
  fill.style.width = score + '%';
  fill.style.background = color;

  document.getElementById('confidenceNote').textContent = 'Retrieval confidence: ' + (data.confidence || 'Unknown');

  const flagsList = document.getElementById('flagsList');
  flagsList.innerHTML = '';
  if (data.flags && data.flags.length > 0) {
    data.flags.forEach(f => {
      const div = document.createElement('div');
      div.className = 'flag-item';
      div.innerHTML = `
        <div class="flag-issue">${f.issue}</div>
        <div class="flag-reasoning">${f.reasoning}</div>
        ${f.source && f.source !== 'none' ? `<span class="flag-source">Ref: ${f.source}</span>` : ''}
      `;
      flagsList.appendChild(div);
    });
  } else {
    const div = document.createElement('div');
    div.className = 'no-flags';
    div.textContent = 'No red flags identified in this document.';
    flagsList.appendChild(div);
  }

  document.getElementById('resultWrap').style.display = 'block';
}
</script>
</body>
</html>
